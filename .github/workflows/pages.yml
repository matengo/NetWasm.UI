name: Site

# Publishes site/ (the NetWasm.UI showcase, built with NetWasm.UI) to GitHub Pages.
# One-time setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - global.json
      - Directory.Build.props
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish (Oz)
        # The prerendered links need the path Pages serves the site under.
        run: dotnet publish site -c Release -p:NetWasmOptimization=Oz -p:NetWasmUIPrerenderBasePath=/${{ github.event.repository.name }}/

      - name: Prepare for Pages (base path)
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          mkdir _site
          rsync -a --exclude '*.dll' --exclude '*.pdb' site/bin/Release/netwasm0.1/publish/ _site/
          # index.html, examples.html and benchmarks.html are prerendered; 404.html is the bare page that Pages
          # answers unknown paths (deep links) with, and the router then renders them.
          for page in index examples benchmarks 404; do
            sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" "_site/$page.html"
            grep -q "<base href=\"$BASE\" />" "_site/$page.html"
            grep -q 'data-nwui-prerender' "_site/$page.html" || [ "$page" = 404 ]
          done
          touch _site/.nojekyll
          ls -lR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
