<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetWasm.UI – Primitives</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    section { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: .5rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    [role=tablist] { display: flex; gap: .25rem; border-bottom: 1px solid #ccd; }
    [role=tab] { border: 0; background: none; padding: .4rem .8rem; cursor: pointer; }
    [role=tab][aria-selected=true] { border-bottom: 2px solid #6a8cff; font-weight: bold; }
    [role=tabpanel] { padding: .75rem 0; }
    .select { position: relative; display: inline-block; }
    .select [role=listbox] { position: absolute; margin: .25rem 0 0; padding: .25rem 0; list-style: none; background: white; border: 1px solid #ccd; border-radius: .4rem; min-width: 10rem; z-index: 5; }
    .select [role=option] { padding: .25rem .75rem; cursor: pointer; }
    .select [role=option][aria-selected=true] { background: #eef; }
    .placeholder { color: #888; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #eee; }
    tr[aria-selected=true] { background: #eef; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
